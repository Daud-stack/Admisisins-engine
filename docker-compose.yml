services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admissions_user
      POSTGRES_PASSWORD: admissions_password
      POSTGRES_DB: admissions_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
